<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#05070d">
  <title>Anruf in die Zukunft</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

  <!-- 1) Startbildschirm -->
  <section id="screen-start" class="screen active">
    <div class="clock" id="clock">--:--</div>
    <div class="contact">
      <div class="avatar-ring"><img class="avatar" id="start-avatar" src="avatar.svg" alt=""></div>
      <h1 id="start-name">…</h1>
      <p id="start-sub">…</p>
    </div>
    <div class="start-actions">
      <button id="btn-call" class="round green" aria-label="Anrufen">
        <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
      </button>
      <span class="hint">Anrufen</span>
    </div>
    <p class="error" id="start-error" hidden></p>
  </section>

  <!-- 2) Verbinden / Klingeln -->
  <section id="screen-ringing" class="screen">
    <div class="contact">
      <div class="avatar-ring pulse"><img class="avatar" id="ring-avatar" src="avatar.svg" alt=""></div>
      <h1 id="ring-name">…</h1>
      <p class="status" id="ring-status">Verbindung durch die Zeit wird aufgebaut …</p>
    </div>
    <div class="call-actions">
      <button class="round red hangup" aria-label="Auflegen"><svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1a1 1 0 0 1-.56.9 11.5 11.5 0 0 0-2.66 1.85 1 1 0 0 1-1.41 0L.29 13.08a1 1 0 0 1 0-1.41A16.9 16.9 0 0 1 12 7c4.57 0 8.72 1.8 11.71 4.67a1 1 0 0 1 0 1.41l-2.48 2.48a1 1 0 0 1-1.41 0 11.3 11.3 0 0 0-2.67-1.85 1 1 0 0 1-.56-.9v-3.1A15 15 0 0 0 12 9z"/></svg></button>
    </div>
  </section>

  <!-- 3) Im Gespräch -->
  <section id="screen-call" class="screen">
    <video id="video" playsinline webkit-playsinline preload="auto"></video>

    <!-- erscheint, wenn eine Videodatei (noch) fehlt -->
    <!-- während man spricht: Avatar "hört zu" (Standbild aus dem Video) -->
    <div id="listening" hidden>
      <div class="avatar-ring listen"><img class="avatar" id="listen-avatar" src="avatar.svg" alt=""></div>
      <p id="listen-label">hört zu …</p>
    </div>

    <div id="placeholder" hidden>
      <div class="ph-box">
        <div class="ph-title">Platzhalter</div>
        <div class="ph-file" id="ph-file"></div>
        <div class="ph-count" id="ph-count"></div>
      </div>
    </div>

    <header class="call-top">
      <div class="who"><strong id="call-name">…</strong><span id="call-timer">00:00</span></div>
      <div class="signal" id="signal"><i></i><i></i><i></i><i></i></div>
    </header>

    <!-- eigenes Bild (Videomodus) bzw. Mikrofon-Pegel (Audiomodus) -->
    <div id="self" class="self">
      <video id="self-video" playsinline muted autoplay></video>
      <div id="self-audio" class="self-audio"><span>Du</span></div>
    </div>

    <div id="talk" class="talk" hidden>
      <div class="talk-state"><span class="rec-dot"></span><span id="talk-label">Du kannst jetzt sprechen …</span></div>
      <div class="meter"><div id="meter-bar"></div></div>
      <button id="btn-done" class="pill">Fertig gesprochen</button>
    </div>

    <footer class="call-actions">
      <button class="round red hangup" aria-label="Auflegen"><svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1a1 1 0 0 1-.56.9 11.5 11.5 0 0 0-2.66 1.85 1 1 0 0 1-1.41 0L.29 13.08a1 1 0 0 1 0-1.41A16.9 16.9 0 0 1 12 7c4.57 0 8.72 1.8 11.71 4.67a1 1 0 0 1 0 1.41l-2.48 2.48a1 1 0 0 1-1.41 0 11.3 11.3 0 0 0-2.67-1.85 1 1 0 0 1-.56-.9v-3.1A15 15 0 0 0 12 9z"/></svg></button>
    </footer>
  </section>

  <!-- 4) Ende -->
  <section id="screen-end" class="screen">
    <div class="contact">
      <div class="avatar-ring dim"><img class="avatar" id="end-avatar" src="avatar.svg" alt=""></div>
      <h1>Anruf beendet</h1>
      <p class="status" id="end-duration"></p>
    </div>
  </section>

  <script src="version.js?v=6"></script>
  <script src="storage.js?v=6"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
